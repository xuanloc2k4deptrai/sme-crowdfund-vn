apiVersion: apps/v1
kind: Deployment
metadata:
  name: sme-crowdfund
  labels:
    app: sme-crowdfund
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sme-crowdfund
  template:
    metadata:
      labels:
        app: sme-crowdfund
    spec:
      containers:
        - name: frontend
          image: your-frontend-image:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend-service:4000/api"
        - name: backend
          image: your-backend-image:latest
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              value: "your-database-connection-string"
      imagePullSecrets:
        - name: regcred